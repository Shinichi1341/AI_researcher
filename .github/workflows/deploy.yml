name: Deploy Site

on:
  push:
    branches: [develop, main]
    paths:
      - "affiliate-engine/site/**"
      - "affiliate-engine/data/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: affiliate-engine/site/package-lock.json

      - name: Install dependencies
        working-directory: affiliate-engine/site
        run: npm ci

      - name: Build site
        working-directory: affiliate-engine/site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: affiliate-engine/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
