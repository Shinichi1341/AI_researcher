name: Daily Pipeline

on:
  schedule:
    # Run daily at 07:00 JST (22:00 UTC)
    - cron: "0 22 * * *"
  push:
    branches: [develop, main]
    paths:
      - "affiliate-engine/reviews/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: affiliate-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affiliate-engine/pyproject.toml

      - name: Install dependencies
        run: pip install .

      - name: Run scheduler (review or auto)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFY_GMAIL_USER: ${{ secrets.NOTIFY_GMAIL_USER }}
          NOTIFY_GMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_GMAIL_APP_PASSWORD }}
          NOTIFY_GMAIL_TO: ${{ secrets.NOTIFY_GMAIL_TO }}
          NOTIFY_SLACK_WEBHOOK_URL: ${{ secrets.NOTIFY_SLACK_WEBHOOK_URL }}
        run: python -m pipeline.scheduler

      - name: Commit results
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-engine/data/ affiliate-engine/reviews/
          git diff --cached --quiet || git commit -m "chore: auto-generate content [$(date +%Y-%m-%d)]"
          git push
