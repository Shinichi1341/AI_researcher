name: Daily Pipeline

on:
  schedule:
    # Run daily at 06:00 JST (21:00 UTC)
    - cron: "0 21 * * *"
  push:
    branches: [develop, main]
    paths:
      - "affiliate-engine/reviews/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: affiliate-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affiliate-engine/pyproject.toml

      - name: Install dependencies
        run: pip install .

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python -m pipeline.main

      - name: Commit generated content
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add affiliate-engine/site/src/content/blog/ affiliate-engine/site/public/ogp/ affiliate-engine/data/
          git diff --cached --quiet || git commit -m "chore: auto-generate daily content [$(date +%Y-%m-%d)]"
          git push
